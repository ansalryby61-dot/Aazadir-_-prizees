<!DOCTYPE html>  <html lang="ar" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Azadir.ly - عجلة الجوائز</title>  
<style>  
body{font-family:Tahoma,Arial;background:#f5f5f5;text-align:center;padding:20px}  
.logo{font-size:42px;font-weight:bold}  
.card{background:white;max-width:700px;margin:auto;padding:20px;border-radius:15px;box-shadow:0 2px 10px rgba(0,0,0,.15)}  
#wheel{width:260px;height:260px;border:10px solid #333;border-radius:50%;margin:20px auto;  
display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;background:#fafafa}  
button{padding:14px 30px;font-size:20px;cursor:pointer}  
#result{font-size:28px;margin-top:20px;font-weight:bold}  
</style>  
</head>  
<body>  
<div class="card">  
<div class="logo">AZADIR.LY</div>  
<h2>🎉 عجلة جوائز أزادير</h2>  
<p>كل فاتورة رابحة</p>  <div id="wheel">🎁</div>  
<button onclick="spinWheel()">لف العجلة</button>  
<div id="result"></div>  
</div>  <script>  
const common=[  
"متر","مفك","بونتة 4","بونتة 5","بونتة 6","مفتاح لانكي",  
"دسكة جلخ","بونتة ربط","صندوق عدة","ألمازة",  
"شفاط زجاج","قادومة","ماكينة سيليكون","ماكينة برشام",  
"بونتة مفصلة 26","بونتة مفصلة 35",  
"خصم 5 دينار","خصم 10 دينار","خصم 20 دينار",  
"خصم 30 دينار","خصم 40 دينار","خصم 50 دينار"  
];  
  
const rare=["تربلو ضي","هلتي","جلخ","تربلو شحن 12"];  
  
// منع تكرار الجوائز حتى تنتهي القائمة  
let pool=[];  
function refillPool(){  
  pool=[];  
  common.forEach(x=>pool.push(x));  
  // جوائز نادرة جداً  
  rare.forEach(x=>{  
      if(Math.random()<0.15) pool.push(x);  
  });  
}  
refillPool();  
  
function spinWheel(){  
 if(pool.length===0) refillPool();  
  
 const wheel=document.getElementById("wheel");  
 const result=document.getElementById("result");  
  
 let count=0;  
 const anim=setInterval(()=>{  
   wheel.innerHTML=common[Math.floor(Math.random()*common.length)];  
   count++;  
   if(count>20){  
      clearInterval(anim);  
      const idx=Math.floor(Math.random()*pool.length);  
      const prize=pool.splice(idx,1)[0];  
      wheel.innerHTML="🎁";  
      result.innerHTML="مبروك! ربحت: "+prize;  
   }  
 },100);  
}  
</script>  </body>  
</html>
