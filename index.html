<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZADIR.LY</title><style>
body{
font-family:Tahoma,Arial;
background:linear-gradient(180deg,#dff4ff,#9fd2ff);
text-align:center;
padding:20px;
margin:0;
}

.logo{
font-size:48px;
font-weight:bold;
color:#0b4f8a;
}

.card{
background:white;
max-width:800px;
margin:auto;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.pointer{
font-size:40px;
color:red;
}

#wheel{
width:300px;
height:300px;
border:10px solid #0b4f8a;
border-radius:50%;
margin:20px auto;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
background:white;
transition:transform 4s ease-out;
}

button{
background:#1976d2;
color:white;
border:none;
padding:14px 30px;
font-size:22px;
border-radius:10px;
cursor:pointer;
}

#result{
font-size:30px;
margin-top:20px;
font-weight:bold;
color:#0b4f8a;
}
</style></head><body><div class="card"><div class="logo">AZADIR.LY</div><h2>🎉 عجلة جوائز أزادير</h2><p>كل فاتورة رابحة</p><div class="pointer">▼</div><div id="wheel">🎁</div><button onclick="spinWheel()">لف العجلة</button>

<div id="result"></div></div><script>

const common=[
"متر",
"مفك",
"بونتة 4",
"بونتة 5",
"بونتة 6",
"مفتاح لانكي",
"دسكة جلخ",
"بونتة ربط",
"صندوق عدة",
"ألمازة",
"شفاط زجاج",
"قادومة",
"ماكينة سيليكون",
"ماكينة برشام",
"بونتة مفصلة 26",
"بونتة مفصلة 35",
"خصم 5 دينار",
"خصم 10 دينار",
"خصم 20 دينار",
"خصم 30 دينار",
"خصم 40 دينار",
"خصم 50 دينار"
];

const rare=[
"تربلو ضي",
"هلتي",
"جلخ",
"تربلو شحن 12"
];

let pool=[];

function refillPool(){
pool=[];

common.forEach(x=>pool.push(x));

rare.forEach(x=>{
if(Math.random()<0.03){
pool.push(x);
}
});
}

refillPool();

function spinWheel(){

if(pool.length===0){
refillPool();
}

const wheel=document.getElementById("wheel");
const result=document.getElementById("result");

const rotate=1800+Math.floor(Math.random()*1200);

wheel.style.transform="rotate("+rotate+"deg)";

setTimeout(()=>{

const idx=Math.floor(Math.random()*pool.length);

const prize=pool.splice(idx,1)[0];

const icons={
"متر":"📏",
"مفك":"🪛",
"صندوق عدة":"🧰",
"هلتي":"🔨",
"جلخ":"⚙️",
"شفاط زجاج":"🪟",
"ماكينة سيليكون":"🛠️",
"ماكينة برشام":"🛠️",
"خصم 50 دينار":"💰",
"خصم 40 دينار":"💵",
"خصم 30 دينار":"💵",
"خصم 20 دينار":"💵",
"خصم 10 دينار":"💵",
"خصم 5 دينار":"💵"
};

wheel.innerHTML=icons[prize] || "🎁";

result.innerHTML="🎉 مبروك! ربحت: <br><span style='font-size:36px'>"+prize+"</span>";

},4000);
}

</script></body>
</html>
