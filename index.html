<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZADIR.LY - عجلة الجوائز</title><style>
body{
margin:0;
font-family:Tahoma,Arial;
background:linear-gradient(135deg,#dff4ff,#9fd2ff,#c7e8ff);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:white;
max-width:900px;
width:100%;
padding:30px;
border-radius:30px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
text-align:center;
}

.logo{
font-size:55px;
font-weight:bold;
color:#0b4f8a;
}

.pointer{
font-size:55px;
color:red;
margin-bottom:-15px;
}

#wheel{
width:400px;
height:400px;
margin:auto;
border-radius:50%;
border:12px solid #1565c0;
background:radial-gradient(circle,#fff,#dff4ff);
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 0 30px rgba(21,101,192,.4);
transition:transform 7s ease-out;
}

#wheelPrize{
font-size:40px;
font-weight:bold;
color:#1565c0;
padding:20px;
}

button{
background:#1976d2;
color:white;
border:none;
padding:16px 40px;
font-size:24px;
border-radius:15px;
cursor:pointer;
margin-top:20px;
}

#result{
margin-top:25px;
font-size:34px;
font-weight:bold;
color:#0b4f8a;
}
</style></head><body><audio id="spinSound">
<source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
</audio><div class="card"><div class="logo">AZADIR.LY</div><h2>🎉 عجلة جوائز أزادير 🎉</h2><p>كل فاتورة رابحة</p><div class="pointer">▼</div><div id="wheel">
<div id="wheelPrize">🎁 اضغط لف العجلة</div>
</div><button onclick="spinWheel()">🎡 لف العجلة</button>

<div id="result"></div></div><script>

const common=[
"متر",
"مفك",
"موس فرش",
"بلاور",
"بونتة 4",
"بونتة 5",
"بونتة 6",
"بونتة 8",
"بونتة 10",
"بونتة هلتي",
"مفتاح لانكي",
"دسكة جلخ",
"بونتة ربط",
"صندوق عدة",
"ألمازة",
"قفل درج",
"شفاط زجاج",
"قادومة",
"ماكينة سيليكون",
"ماكينة برشام",
"بونتة مفصلة 26",
"بونتة مفصلة 35",
"خصم 5 دينار",
"خصم 10 دينار",
"خصم 15 دينار",
"خصم 20 دينار",
"خصم 25 دينار",
"خصم 30 دينار",
"خصم 35 دينار",
"خصم 40 دينار",
"خصم 45 دينار",
"خصم 50 دينار"
];

const rare=[
"تربلو ضي",
"هلتي",
"جلخ",
"تربلو شحن 12"
];

let pool=[];

function refillPool(){

pool=[];

common.forEach(x=>pool.push(x));

rare.forEach(x=>{
if(Math.random()<0.03){
pool.push(x);
}
});

}

refillPool();

function spinWheel(){

document.getElementById("spinSound").play();

if(pool.length===0){
refillPool();
}

const wheel=document.getElementById("wheel");

const rotate=4500+Math.floor(Math.random()*2500);

wheel.style.transform="rotate("+rotate+"deg)";

setTimeout(()=>{

const idx=Math.floor(Math.random()*pool.length);

const prize=pool.splice(idx,1)[0];

document.getElementById("wheelPrize").innerHTML=
prize;

document.getElementById("result").innerHTML=
"🏆 مبروك!<br><span style='font-size:46px'>"+prize+"</span>";

},7000);

}

</script></body>
</html>
