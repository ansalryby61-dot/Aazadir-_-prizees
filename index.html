<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azadir.ly - عجلة الجوائز</title><style>
body{
font-family:Tahoma,Arial;
background:linear-gradient(135deg,#dff4ff,#9fd2ff,#c7e8ff);
text-align:center;
padding:20px;
margin:0;
}

.logo{
font-size:42px;
font-weight:bold;
color:#0b4f8a;
}

.card{
background:white;
max-width:700px;
margin:auto;
padding:20px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

#wheel{
width:260px;
height:260px;
border:10px solid #1565c0;
border-radius:50%;
margin:20px auto;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
background:radial-gradient(circle,#fff,#dff4ff);
transition:transform 7s ease-out;
}

button{
padding:14px 30px;
font-size:20px;
cursor:pointer;
background:#1976d2;
color:white;
border:none;
border-radius:10px;
}

#result{
font-size:28px;
margin-top:20px;
font-weight:bold;
color:#0b4f8a;
}
</style></head><body><audio id="spinSound">
<source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
</audio><div class="card"><div class="logo">AZADIR.LY</div><h2>🎉 عجلة جوائز أزادير</h2><p>كل فاتورة رابحة</p><div id="wheel">🎁</div><button onclick="spinWheel()">لف العجلة</button>

<div id="result"></div></div><script>

const common=[
"متر",
"مفك",
"موس فرش",
"بلاور",
"بونتة 4",
"بونتة 5",
"بونتة 6",
"بونتة 8",
"بونتة 10",
"بونتة هلتي",
"مفتاح لانكي",
"دسكة جلخ",
"بونتة ربط",
"صندوق عدة",
"ألمازة",
"قفل درج",
"شفاط زجاج",
"قادومة",
"ماكينة سيليكون",
"ماكينة برشام",
"بونتة مفصلة 26",
"بونتة مفصلة 35",
"خصم 5 دينار",
"خصم 10 دينار",
"خصم 15 دينار",
"خصم 20 دينار",
"خصم 25 دينار",
"خصم 30 دينار",
"خصم 35 دينار",
"خصم 40 دينار",
"خصم 45 دينار",
"خصم 50 دينار"
];

const rare=[
"تربلو ضي",
"هلتي",
"جلخ",
"تربلو شحن 12"
];

let pool=[];

function refillPool(){
pool=[];

common.forEach(x=>pool.push(x));

rare.forEach(x=>{
if(Math.random()<0.03){
pool.push(x);
}
});
}

refillPool();

function spinWheel(){

document.getElementById("spinSound").play();

if(pool.length===0) refillPool();

const wheel=document.getElementById("wheel");
const result=document.getElementById("result");

const rotate=4500+Math.floor(Math.random()*2500);

wheel.style.transform="rotate("+rotate+"deg)";

setTimeout(()=>{

const idx=Math.floor(Math.random()*pool.length);

const prize=pool.splice(idx,1)[0];

wheel.innerHTML="🎁";

result.innerHTML="🎉 مبروك! ربحت: "+prize;

},7000);

}

</script></body>
</html>
